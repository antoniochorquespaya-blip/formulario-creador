<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulario del Creador · OBS</title>
  <meta name="description" content="Formulario de conocimiento del creador de contenido" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0C0C0E;
      --surface: #16161A;
      --surface-hover: #1E1E24;
      --border: #2A2A32;
      --border-focus: #E8B931;
      --text: #F0EDE6;
      --text-sec: #8A8A96;
      --text-muted: #5A5A66;
      --accent: #E8B931;
      --accent-dim: rgba(232,185,49,0.12);
      --red: #D94F3D;
      --green: #4CAF50;
      --blue: #5C6BC0;
      --orange: #FF9800;
      --r: 12px;
      --rs: 8px;
      --font: 'DM Sans', system-ui, sans-serif;
      --font-d: 'Playfair Display', Georgia, serif;
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Noise texture ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0;
    }

    .wrap { position: relative; z-index: 1; }

    /* ── Header ── */
    .hdr {
      text-align: center;
      padding: 56px 24px 44px;
      position: relative;
    }
    .hdr::after {
      content: '';
      position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }
    .hdr h1 {
      font-family: var(--font-d);
      font-size: clamp(26px, 5vw, 40px);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .hdr h1 em { font-style: normal; color: var(--accent); }
    .hdr .sub {
      font-size: 14px;
      color: var(--text-sec);
      max-width: 500px;
      margin: 14px auto 0;
      line-height: 1.65;
    }

    /* ── Progress ── */
    .prog-bar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(12,12,14,0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
    }
    .prog-inner { max-width: 700px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
    .prog-track { flex: 1; height: 4px; background: var(--border); border-radius: 4px; overflow: hidden; }
    .prog-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width .5s cubic-bezier(.22,1,.36,1); }
    .prog-pct { font-size: 12px; font-weight: 600; color: var(--accent); min-width: 34px; text-align: right; }

    /* ── Section Nav ── */
    .snav {
      display: flex; gap: 6px; padding: 18px 24px;
      max-width: 740px; margin: 0 auto;
      overflow-x: auto; scrollbar-width: none;
    }
    .snav::-webkit-scrollbar { display: none; }
    .pill {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 13px; border-radius: 100px;
      border: 1px solid var(--border); background: transparent;
      color: var(--text-sec); font: 500 12.5px/1 var(--font);
      cursor: pointer; white-space: nowrap; transition: all .25s;
    }
    .pill:hover { border-color: var(--text-muted); color: var(--text); }
    .pill.act { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }
    .pill.done { border-color: var(--green); color: var(--green); }

    /* ── Form Body ── */
    .fbody { max-width: 700px; margin: 0 auto; padding: 0 24px 100px; }

    .fsec { margin-bottom: 52px; animation: fadeUp .45s ease both; }
    @keyframes fadeUp { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform: translateY(0); } }

    .sec-hdr { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
    .sec-ico {
      width: 46px; height: 46px; display: flex; align-items: center; justify-content: center;
      font-size: 21px; border-radius: var(--r); flex-shrink: 0;
    }
    .sec-hdr h2 { font-family: var(--font-d); font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
    .sec-hdr p { font-size: 12.5px; color: var(--text-sec); margin-top: 2px; }

    /* ── Fields ── */
    .fg { margin-bottom: 26px; }
    .fl { display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 5px; line-height: 1.45; }
    .fh { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 9px; line-height: 1.5; font-style: italic; }
    .fi, .ft {
      width: 100%; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--rs);
      padding: 11px 15px; font: 14px/1.55 var(--font); color: var(--text);
      transition: border-color .2s, box-shadow .2s; outline: none;
    }
    .fi:focus, .ft:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px var(--accent-dim); }
    .fi::placeholder, .ft::placeholder { color: var(--text-muted); }
    .ft { min-height: 96px; resize: vertical; }
    .ft.lg { min-height: 150px; }

    /* ── Submit ── */
    .submit-area { text-align: center; padding: 36px 0; border-top: 1px solid var(--border); margin-top: 16px; }
    .btn-go {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 15px 46px; background: var(--accent); color: #0C0C0E;
      border: none; border-radius: 100px;
      font: 700 14.5px/1 var(--font); cursor: pointer;
      letter-spacing: .02em; text-transform: uppercase;
      transition: all .2s;
    }
    .btn-go:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(232,185,49,.3); }
    .btn-go:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }

    /* ── Success ── */
    .success {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 48px 24px; text-align: center;
    }
    .success .ico {
      width: 76px; height: 76px; border-radius: 50%;
      background: rgba(76,175,80,.12);
      display: flex; align-items: center; justify-content: center;
      font-size: 34px; margin-bottom: 22px;
      animation: popIn .5s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
    .success h2 { font-family: var(--font-d); font-size: 26px; font-weight: 700; margin-bottom: 10px; }
    .success p { color: var(--text-sec); font-size: 14.5px; max-width: 400px; line-height: 1.6; }

    /* ── Admin ── */
    .admin-login {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 48px 24px; text-align: center;
    }
    .admin-login h2 { font-family: var(--font-d); font-size: 24px; margin-bottom: 20px; }
    .admin-login .fi { max-width: 300px; text-align: center; margin-bottom: 14px; }
    .admin-login .btn-go { padding: 12px 36px; font-size: 13px; }
    .admin-login .err { color: var(--red); font-size: 13px; margin-top: 10px; }

    .adm-hdr {
      padding: 28px 24px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 16px; max-width: 1100px; margin: 0 auto;
    }
    .adm-hdr h1 { font-family: var(--font-d); font-size: 24px; font-weight: 700; }
    .adm-hdr h1 em { font-style: normal; color: var(--accent); }
    .stat-n { font: 700 26px var(--font-d); color: var(--accent); }
    .stat-l { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; }

    .adm-body { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .adm-acts { display: flex; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; }
    .ba {
      padding: 9px 18px; border-radius: 100px; border: 1px solid var(--border);
      background: transparent; color: var(--text-sec);
      font: 500 12.5px/1 var(--font); cursor: pointer; transition: all .2s;
      display: flex; align-items: center; gap: 6px;
    }
    .ba:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
    .ba.dng:hover { border-color: var(--red); color: var(--red); background: rgba(217,79,61,.1); }

    .rc {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); margin-bottom: 14px; overflow: hidden;
      transition: border-color .2s;
    }
    .rc:hover { border-color: var(--text-muted); }
    .rch {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 18px; cursor: pointer; gap: 12px;
    }
    .rch:hover { background: var(--surface-hover); }
    .rch-l { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
    .avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--accent-dim); display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px; color: var(--accent); flex-shrink: 0;
    }
    .rch-l h3 { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rch-l .meta { font-size: 11.5px; color: var(--text-muted); margin-top: 1px; }
    .rch-r { display: flex; align-items: center; gap: 10px; }
    .badge {
      padding: 3px 9px; border-radius: 100px;
      font-size: 11px; font-weight: 600; letter-spacing: .02em;
    }
    .del-sm {
      padding: 5px 12px; border-radius: 100px; border: 1px solid var(--border);
      background: transparent; color: var(--text-muted);
      font: 12px var(--font); cursor: pointer; transition: all .2s;
    }
    .del-sm:hover { border-color: var(--red); color: var(--red); background: rgba(217,79,61,.1); }
    .chev { transition: transform .3s; color: var(--text-muted); font-size: 16px; }
    .chev.open { transform: rotate(180deg); }

    .rcb { padding: 0 18px 18px; border-top: 1px solid var(--border); }
    .rcb-s { margin-top: 18px; }
    .rcb-s h4 {
      font-size: 12.5px; font-weight: 600; color: var(--accent);
      text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px;
      display: flex; align-items: center; gap: 7px;
    }
    .rcb-f { margin-bottom: 12px; }
    .rcb-f .q { font-size: 12px; font-weight: 600; color: var(--text-sec); margin-bottom: 3px; }
    .rcb-f .a {
      font-size: 13.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
      padding: 9px 13px; background: rgba(255,255,255,.025);
      border-radius: var(--rs); border-left: 3px solid var(--border);
    }
    .rcb-f .a.emp { color: var(--text-muted); font-style: italic; border-left-color: transparent; background: transparent; }

    .empty {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 72px 24px; text-align: center;
    }
    .empty .big { font-size: 44px; margin-bottom: 18px; opacity: .3; }
    .empty h3 { font-family: var(--font-d); font-size: 20px; font-weight: 600; color: var(--text-sec); margin-bottom: 8px; }
    .empty p { font-size: 13.5px; color: var(--text-muted); max-width: 340px; line-height: 1.5; }

    /* ── Loading ── */
    .overlay {
      position: fixed; inset: 0; background: rgba(12,12,14,.8);
      backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center;
      z-index: 300;
    }
    .spin {
      width: 38px; height: 38px;
      border: 3px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: sp .8s linear infinite;
    }
    @keyframes sp { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }

    @media (max-width: 600px) {
      .hdr { padding: 36px 16px 28px; }
      .fbody, .adm-body { padding-left: 16px; padding-right: 16px; }
      .adm-hdr { padding: 18px 16px; }
      .snav { padding: 10px 16px; }
    }
  </style>
</head>
<body>
  <div class="wrap" id="app"></div>

  <script>
  /* ═══════════════════════════════════════════════════
     CONFIG — Cambia estos valores
     ═══════════════════════════════════════════════════ */
const CONFIG = {
    ADMIN_PASSWORD: "obs2024",
    EMAILJS_PUBLIC_KEY: "nNTtRtc6gFG8LsP4j",
    EMAILJS_SERVICE_ID: "service_un1e8qn",
    EMAILJS_TEMPLATE_ID: "template_cz8wszw",
    NOTIFY_EMAIL: "antoniochorquespaya@gmail.com",
};

  /* ═══════════════════════════════════════════════════
     DATA — Estructura del formulario
     ═══════════════════════════════════════════════════ */
  const SECTIONS = [
    {
      id: "datos", icon: "📋", title: "DATOS PERSONALES",
      subtitle: "Información básica del creador", color: "#E8B931",
      fields: [
        { id: "proyecto_nombre", label: "Nombre que te gustaría que tuviera el proyecto", type: "text" },
        { id: "nombre_completo", label: "Nombre completo", type: "text" },
        { id: "dni", label: "DNI", type: "text" },
        { id: "direccion", label: "Dirección", type: "text" },
        { id: "codigo_postal", label: "Código Postal", type: "text" },
        { id: "ciudad", label: "Ciudad", type: "text" },
        { id: "fecha_nacimiento", label: "Fecha de nacimiento", type: "date" },
        { id: "cuenta_bancaria", label: "Nº de cuenta", type: "text" },
      ]
    },
    {
      id: "entrenamiento", icon: "💪", title: "METODOLOGÍA DE ENTRENAMIENTO",
      subtitle: "Tu filosofía y enfoque del entrenamiento", color: "#D94F3D",
      fields: [
        { id: "q1", label: "1. ¿Cuál es tu distribución semanal de entrenamiento preferida?", hint: "Ej: Push/Pull/Legs, Full Body, Upper/Lower... Indica para 6, 5, 4, 3 días a la semana.", type: "textarea" },
        { id: "q2", label: "2. ¿Cuántas series por sesión consideras ideal?", hint: "Indica si varía según el grupo muscular o el tipo de sesión.", type: "textarea" },
        { id: "q3", label: "3. ¿Cuántos ejercicios por sesión? ¿Cuántas series por ejercicio?", hint: "Compuesto vs aislamiento, top set y back off, técnicas de intensidad.", type: "textarea" },
        { id: "q4", label: "4. ¿Qué rango de repeticiones prefieres y por qué?", hint: "Fuerza (1-5), hipertrofia (6-12), resistencia (12+). ¿Combinas rangos?", type: "textarea" },
        { id: "q5", label: "5. ¿Cuál es tu postura respecto al RIR, RPE y el fallo muscular?", hint: "¿Entrenas al fallo? ¿Repeticiones en reserva? ¿Varía según fase o ejercicio?", type: "textarea" },
        { id: "q6", label: "6. ¿Cuáles son tus ejercicios estrella o imprescindibles?", hint: "Los que nunca faltan. Indica por qué los consideras fundamentales.", type: "textarea" },
        { id: "q7", label: "7. Comparte ejemplos de entrenamientos que estés realizando actualmente.", hint: "Si puedes mandar el documento, perfecto.", type: "textarea" },
        { id: "q8", label: "8. ¿Prefieres entrenar pesado, con técnica estricta o combinación?", hint: "Explica tu filosofía y cómo lo aplicas.", type: "textarea" },
        { id: "q9", label: "9. ¿Cómo gestionas las progresiones semanales de carga?", hint: "Progresiones lineales, volumen, intensidad… Explica tu método.", type: "textarea" },
        { id: "q10", label: "10. ¿Cada cuánto consideras que hay que cambiar los entrenamientos?", hint: "¿Cada semana, mesociclo, bloque? ¿Qué criterios usas?", type: "textarea" },
      ]
    },
    {
      id: "nutricion", icon: "🍏", title: "NUTRICIÓN Y SUPLEMENTACIÓN",
      subtitle: "Tu enfoque nutricional y de suplementos", color: "#4CAF50",
      fields: [
        { id: "q11", label: "11. ¿Qué tipo de dieta prefieres para tus clientes?", hint: "¿Cerrada, con opciones intercambiables o sistema de equivalencias?", type: "textarea" },
        { id: "q12", label: "12. ¿Particularidad en distribución de macronutrientes?", hint: "Alta/baja en grasas, alta proteína, cetogénico, ciclado de carbos…", type: "textarea" },
        { id: "q13", label: "13. ¿Incluyes recetas elaboradas en los planes nutricionales?", hint: "¿Comidas sencillas o recetas más trabajadas?", type: "textarea" },
        { id: "q14", label: "14. ¿Cuál es tu postura respecto a la suplementación?", hint: "¿Solo lo esencial o protocolo más completo? Suplementos clave.", type: "textarea" },
      ]
    },
    {
      id: "personal", icon: "👤", title: "PERFIL PERSONAL Y COMUNICACIÓN",
      subtitle: "Tu historia, tu voz y tu identidad", color: "#5C6BC0",
      fields: [
        { id: "q15", label: "15. ¿Cómo empezaste en el fitness y cómo llegaste hasta aquí?", hint: "Tu recorrido, momentos clave, transformaciones, por qué te dedicas a esto…", type: "textarea", large: true },
        { id: "q16", label: "16. ¿Cómo describirías tu forma de hablar y de comunicar?", hint: "Directo, motivacional, científico, cercano, humorístico…", type: "textarea" },
        { id: "q17", label: "17. ¿Cuáles son tus palabras, frases o muletillas más usadas?", hint: "Expresiones que te identifican, formas de saludar, motivar…", type: "textarea" },
        { id: "q18", label: "18. ¿Cuáles son tus aficiones fuera del fitness?", hint: "Hobbies, intereses, pasiones…", type: "textarea" },
        { id: "q19", label: "19. ¿Qué tipo de series, películas, vídeos o libros consumes?", hint: "Géneros, títulos, creadores, podcasts…", type: "textarea" },
        { id: "q20", label: "20. ¿Cuáles son tus horarios habituales?", hint: "Hora de despertar, entrenar, dormir, hábitos diarios…", type: "textarea" },
        { id: "q21", label: "21. ¿Tienes limitaciones o líneas rojas que debamos respetar?", hint: "Temas que no quieres tratar, enfoques que rechazas…", type: "textarea" },
        { id: "q22", label: "22. ¿Nota al seguimiento actual de tus clientes? ¿Qué mejorarías?", hint: "Puntos fuertes, débiles, qué te gustaría ofrecer…", type: "textarea", large: true },
      ]
    },
    {
      id: "advertencias", icon: "⚠️", title: "ADVERTENCIAS Y CONSIDERACIONES",
      subtitle: "Aspectos importantes para el proyecto", color: "#FF9800",
      fields: [
        { id: "q23", label: "23. ¿Temas de periodos temporales que debamos evitar en comunicación?", hint: "Ej: Evitar prometer resultados en plazos concretos…", type: "textarea" },
        { id: "q24", label: "24. ¿Alguna otra advertencia o nota importante para el equipo?", hint: "Cualquier detalle adicional.", type: "textarea", large: true },
      ]
    }
  ];

  const ALL_FIELDS = SECTIONS.flatMap(s => s.fields);
  const TOTAL = ALL_FIELDS.length;

  /* ═══════════════════════════════════════════════════
     STATE
     ═══════════════════════════════════════════════════ */
  let currentView = "form"; // form | admin-login | admin
  let formData = {};
  let formSubmitted = false;
  let responses = [];
  let expandedId = null;
  let activeSec = SECTIONS[0].id;

  /* ═══════════════════════════════════════════════════
     STORAGE — localStorage (works offline, no backend)
     ═══════════════════════════════════════════════════ */
  const STORE_KEY = "obs_form_responses";

  function loadResponses() {
    try {
      return JSON.parse(localStorage.getItem(STORE_KEY) || "[]");
    } catch { return []; }
  }
  function saveResponses(data) {
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
  }

  /* ═══════════════════════════════════════════════════
     EMAIL — via EmailJS (optional)
     ═══════════════════════════════════════════════════ */
  async function sendEmail(entry) {
    if (!CONFIG.EMAILJS_PUBLIC_KEY || !CONFIG.EMAILJS_SERVICE_ID || !CONFIG.EMAILJS_TEMPLATE_ID) return;
    try {
      const name = entry.data.nombre_completo || "Sin nombre";
      const project = entry.data.proyecto_nombre || "Sin proyecto";
      const answered = ALL_FIELDS.filter(f => entry.data[f.id]?.trim()).length;
      const summary = SECTIONS.map(s => {
        const lines = s.fields.map(f => {
          const val = entry.data[f.id]?.trim();
          return `${f.label}\n→ ${val || "(sin respuesta)"}`;
        }).join("\n\n");
        return `${s.icon} ${s.title}\n${"─".repeat(40)}\n${lines}`;
      }).join("\n\n\n");

      await emailjs.send(CONFIG.EMAILJS_SERVICE_ID, CONFIG.EMAILJS_TEMPLATE_ID, {
        to_email: CONFIG.NOTIFY_EMAIL,
        creator_name: name,
        project_name: project,
        answered_count: `${answered}/${TOTAL}`,
        date: new Date().toLocaleString("es-ES"),
        full_responses: summary,
      });
    } catch (e) {
      console.warn("Email notification failed:", e);
    }
  }

  /* ═══════════════════════════════════════════════════
     RENDER
     ═══════════════════════════════════════════════════ */
  const $ = id => document.getElementById(id);
  const app = document.getElementById("app");

  function render() {
    if (currentView === "form") renderForm();
    else if (currentView === "admin-login") renderAdminLogin();
    else if (currentView === "admin") renderAdmin();
  }

  /* ── Form ── */
  function renderForm() {
    if (formSubmitted) {
      app.innerHTML = `
        <div class="success">
          <div class="ico">✓</div>
          <h2>¡Formulario enviado!</h2>
          <p>Gracias por tu tiempo. Tus respuestas nos permitirán crear un proyecto totalmente alineado con tu visión, tu marca y tu forma de comunicar.</p>
        </div>`;
      return;
    }

    const filled = ALL_FIELDS.filter(f => formData[f.id]?.trim()).length;
    const pct = Math.round((filled / TOTAL) * 100);

    const sectionsHTML = SECTIONS.map(s => {
      const fieldsHTML = s.fields.map(f => {
        const val = formData[f.id] || "";
        const hintHTML = f.hint ? `<span class="fh">${f.hint}</span>` : "";
        if (f.type === "textarea") {
          return `<div class="fg">
            <label class="fl">${f.label}</label>${hintHTML}
            <textarea class="ft${f.large ? " lg" : ""}" data-fid="${f.id}" placeholder="Escribe tu respuesta...">${val}</textarea>
          </div>`;
        }
        return `<div class="fg">
          <label class="fl">${f.label}</label>${hintHTML}
          <input type="${f.type}" class="fi" data-fid="${f.id}" value="${val}" ${f.type !== "date" ? 'placeholder="Escribe tu respuesta..."' : ""} />
        </div>`;
      }).join("");

      const done = s.fields.every(f => formData[f.id]?.trim());
      return `<div class="fsec" data-section="${s.id}" id="sec-${s.id}">
        <div class="sec-hdr">
          <div class="sec-ico" style="background:${s.color}18;color:${s.color}">${s.icon}</div>
          <div><h2>${s.title}</h2><p>${s.subtitle}</p></div>
        </div>
        ${fieldsHTML}
      </div>`;
    }).join("");

    const pillsHTML = SECTIONS.map(s => {
      const done = s.fields.every(f => formData[f.id]?.trim());
      const cls = activeSec === s.id ? "act" : (done ? "done" : "");
      return `<button class="pill ${cls}" data-nav="${s.id}">${s.icon} ${s.title}</button>`;
    }).join("");

    app.innerHTML = `
      <div class="hdr">
        <h1>Formulario del <em>Creador</em></h1>
        <p class="sub">Proyecto de asesorías de entrenamiento y nutrición. Conocer en profundidad tu visión sobre el entrenamiento, la nutrición y tu forma de comunicar.</p>
      </div>
      <div class="prog-bar">
        <div class="prog-inner">
          <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
          <div class="prog-pct">${pct}%</div>
        </div>
      </div>
      <nav class="snav">${pillsHTML}</nav>
      <div class="fbody">
        ${sectionsHTML}
        <div class="submit-area">
          <button class="btn-go" id="btnSubmit">Enviar formulario →</button>
        </div>
      </div>`;

    // Events
    app.querySelectorAll("[data-fid]").forEach(el => {
      el.addEventListener("input", e => {
        formData[e.target.dataset.fid] = e.target.value;
        updateProgress();
      });
    });

    app.querySelectorAll("[data-nav]").forEach(btn => {
      btn.addEventListener("click", () => {
        const sec = document.getElementById("sec-" + btn.dataset.nav);
        if (sec) sec.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });

    $("btnSubmit").addEventListener("click", handleSubmit);
    setupScrollObserver();
  }

  function updateProgress() {
    const filled = ALL_FIELDS.filter(f => formData[f.id]?.trim()).length;
    const pct = Math.round((filled / TOTAL) * 100);
    const fill = app.querySelector(".prog-fill");
    const label = app.querySelector(".prog-pct");
    if (fill) fill.style.width = pct + "%";
    if (label) label.textContent = pct + "%";

    // Update pills
    app.querySelectorAll(".pill").forEach(p => {
      const sid = p.dataset.nav;
      const sec = SECTIONS.find(s => s.id === sid);
      const done = sec.fields.every(f => formData[f.id]?.trim());
      p.classList.toggle("done", done);
    });
  }

  function setupScrollObserver() {
    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          activeSec = e.target.dataset.section;
          app.querySelectorAll(".pill").forEach(p => {
            p.classList.toggle("act", p.dataset.nav === activeSec);
          });
        }
      });
    }, { rootMargin: "-30% 0px -60% 0px" });
    app.querySelectorAll(".fsec").forEach(el => observer.observe(el));
  }

  async function handleSubmit() {
    if (!formData.nombre_completo?.trim()) {
      alert("Por favor, introduce al menos tu nombre completo.");
      return;
    }

    const btn = $("btnSubmit");
    btn.disabled = true;
    btn.textContent = "Enviando...";

    const entry = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      submittedAt: new Date().toISOString(),
      data: { ...formData }
    };

    responses = loadResponses();
    responses.push(entry);
    saveResponses(responses);

    await sendEmail(entry);

    formSubmitted = true;
    render();
  }

  /* ── Admin Login ── */
  function renderAdminLogin() {
    app.innerHTML = `
      <div class="admin-login">
        <h2>🔐 Panel de Administración</h2>
        <input type="password" class="fi" id="adminPwd" placeholder="Contraseña" />
        <button class="btn-go" id="btnLogin" style="margin-top:8px">Acceder</button>
        <div class="err hidden" id="loginErr">Contraseña incorrecta</div>
        <div style="margin-top:24px">
          <button class="ba" id="btnBackForm">← Volver al formulario</button>
        </div>
      </div>`;

    $("btnLogin").addEventListener("click", tryLogin);
    $("adminPwd").addEventListener("keydown", e => { if (e.key === "Enter") tryLogin(); });
    $("btnBackForm").addEventListener("click", () => { currentView = "form"; render(); });
  }

  function tryLogin() {
    const pwd = $("adminPwd").value;
    if (pwd === CONFIG.ADMIN_PASSWORD) {
      currentView = "admin";
      responses = loadResponses();
      render();
    } else {
      $("loginErr").classList.remove("hidden");
    }
  }

  /* ── Admin Panel ── */
  function renderAdmin() {
    responses = loadResponses();
    const count = responses.length;

    const cardsHTML = count === 0
      ? `<div class="empty"><div class="big">📭</div><h3>Sin respuestas todavía</h3><p>Cuando alguien complete el formulario, sus respuestas aparecerán aquí.</p></div>`
      : [...responses].reverse().map(r => {
        const name = r.data.nombre_completo || "Sin nombre";
        const proj = r.data.proyecto_nombre || "Sin proyecto";
        const initials = name.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
        const date = new Date(r.submittedAt).toLocaleDateString("es-ES", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
        const ans = ALL_FIELDS.filter(f => r.data[f.id]?.trim()).length;
        const isOpen = expandedId === r.id;
        const bClr = ans === TOTAL ? "rgba(76,175,80,.12)" : "rgba(255,152,0,.12)";
        const bTxt = ans === TOTAL ? "#4CAF50" : "#FF9800";

        let bodyHTML = "";
        if (isOpen) {
          bodyHTML = `<div class="rcb">${SECTIONS.map(s => `
            <div class="rcb-s">
              <h4>${s.icon} ${s.title}</h4>
              ${s.fields.map(f => {
                const v = r.data[f.id]?.trim();
                return `<div class="rcb-f"><div class="q">${f.label}</div><div class="a${v ? "" : " emp"}">${v || "Sin respuesta"}</div></div>`;
              }).join("")}
            </div>`).join("")}</div>`;
        }

        return `<div class="rc">
          <div class="rch" data-toggle="${r.id}">
            <div class="rch-l">
              <div class="avatar">${initials}</div>
              <div><h3>${name}</h3><div class="meta">${proj} · ${date}</div></div>
            </div>
            <div class="rch-r">
              <span class="badge" style="background:${bClr};color:${bTxt}">${ans}/${TOTAL}</span>
              <button class="del-sm" data-del="${r.id}">Eliminar</button>
              <span class="chev${isOpen ? " open" : ""}">▼</span>
            </div>
          </div>
          ${bodyHTML}
        </div>`;
      }).join("");

    app.innerHTML = `
      <div class="adm-hdr">
        <div><h1>Panel de <em>Respuestas</em></h1></div>
        <div style="text-align:center"><div class="stat-n">${count}</div><div class="stat-l">Respuestas</div></div>
      </div>
      <div class="adm-body">
        ${count > 0 ? `<div class="adm-acts">
          <button class="ba" id="btnCSV">📥 Exportar CSV</button>
          <button class="ba" id="btnRefresh">🔄 Actualizar</button>
          <button class="ba dng" id="btnClear">🗑️ Borrar todo</button>
          <button class="ba" id="btnLogout">🚪 Cerrar sesión</button>
        </div>` : `<div class="adm-acts"><button class="ba" id="btnLogout">🚪 Cerrar sesión</button></div>`}
        ${cardsHTML}
      </div>`;

    // Events
    app.querySelectorAll("[data-toggle]").forEach(el => {
      el.addEventListener("click", e => {
        if (e.target.closest("[data-del]")) return;
        const id = el.dataset.toggle;
        expandedId = expandedId === id ? null : id;
        renderAdmin();
      });
    });

    app.querySelectorAll("[data-del]").forEach(btn => {
      btn.addEventListener("click", e => {
        e.stopPropagation();
        if (!confirm("¿Eliminar esta respuesta?")) return;
        responses = responses.filter(r => r.id !== btn.dataset.del);
        saveResponses(responses);
        if (expandedId === btn.dataset.del) expandedId = null;
        renderAdmin();
      });
    });

    const csvBtn = $("btnCSV");
    if (csvBtn) csvBtn.addEventListener("click", exportCSV);
    const refBtn = $("btnRefresh");
    if (refBtn) refBtn.addEventListener("click", () => { responses = loadResponses(); renderAdmin(); });
    const clrBtn = $("btnClear");
    if (clrBtn) clrBtn.addEventListener("click", () => {
      if (!confirm("¿Eliminar TODAS las respuestas?")) return;
      saveResponses([]);
      responses = [];
      expandedId = null;
      renderAdmin();
    });
    const logBtn = $("btnLogout");
    if (logBtn) logBtn.addEventListener("click", () => { currentView = "form"; render(); });
  }

  function exportCSV() {
    if (!responses.length) return;
    const ids = ALL_FIELDS.map(f => f.id);
    const labels = ALL_FIELDS.map(f => f.label);
    const hdr = ["Fecha", ...labels].map(h => `"${h}"`).join(",");
    const rows = responses.map(r => {
      const d = new Date(r.submittedAt).toLocaleString("es-ES");
      const vals = ids.map(id => `"${(r.data[id] || "").replace(/"/g, '""')}"`);
      return [`"${d}"`, ...vals].join(",");
    });
    const csv = [hdr, ...rows].join("\n");
    const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `respuestas_${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  /* ═══════════════════════════════════════════════════
     URL ROUTING — ?admin para ir directo al login
     ═══════════════════════════════════════════════════ */
  function initRouting() {
    const params = new URLSearchParams(window.location.search);
    if (params.has("admin")) {
      currentView = "admin-login";
    }
  }

  /* ═══════════════════════════════════════════════════
     INIT
     ═══════════════════════════════════════════════════ */
  responses = loadResponses();
  initRouting();
  render();

  </script>

  <!-- EmailJS SDK — solo se carga si configuras las claves -->
  <script>
    if (CONFIG.EMAILJS_PUBLIC_KEY) {
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js";
      s.onload = () => emailjs.init(CONFIG.EMAILJS_PUBLIC_KEY);
      document.head.appendChild(s);
    }
  </script>
</body>
</html>
